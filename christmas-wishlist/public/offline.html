<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f5135" />
    <title>Offline · Family Wishlist</title>
    <!-- Self-contained on purpose: shown by the service worker with no network,
         so it can't rely on the app's scripts or styles. -->
    <style>
      html { font-size: 112.5%; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        background: #fbf7f0; color: #1f2a24; text-align: center;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main { max-width: 28rem; padding: 2.5rem 1rem; }
      h1 { font-family: ui-serif, Georgia, serif; font-size: 1.875rem; margin: 1rem 0 0; }
      p { font-size: 1.125rem; line-height: 1.5; }
      .muted { color: #55615a; font-size: 1rem; }
      button {
        margin-top: 2rem; width: 100%; min-height: 3.25rem; border: 0; border-radius: 0.75rem;
        background: #1f5135; color: #fff; font-size: 1.125rem; font-weight: 600; cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #1f5135; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div aria-hidden="true" style="font-size: 3.75rem">📶</div>
      <h1>You're offline</h1>
      <p>Family Wishlist needs an internet connection to show the latest lists, so nobody reserves the same gift twice.</p>
      <p class="muted">Check your Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
